name: Build & Package Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test_and_build:
    name: Run Automated Tests & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Game Logic Automated Tests
        run: |
          npm test
          node test/run_all_tests.js

      - name: Bundle Web Engine Assets for Android
        run: |
          node scripts/bundle.js

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Build Environment (v8.2)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-read-only: false

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Set Executable Permissions on Gradle Wrapper
        run: |
          chmod +x android/gradlew

      - name: Build Android Debug & Release APKs
        run: |
          cd android
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload Built APKs Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReinoProtetor-Android-APKs
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error
