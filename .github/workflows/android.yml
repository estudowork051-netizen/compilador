name: Gerar APK da Paciencia

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
    - name: 1. Baixar Codigo do Repositorio
      uses: actions/checkout@v4

    - name: 2. Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. Garantir Gradle Wrapper e Permissoes
      run: |
        chmod +x gradlew || true
        mkdir -p gradle/wrapper

        # Verifica se gradle-wrapper.jar existe e e um arquivo ZIP/JAR integro
        if [ ! -s gradle/wrapper/gradle-wrapper.jar ] || ! unzip -tq gradle/wrapper/gradle-wrapper.jar 2>/dev/null; then
          echo "Configurando Gradle Wrapper 8.2 oficial..."
          rm -f gradle/wrapper/gradle-wrapper.jar

          # 1. Tenta gerar via comando gradle pre-instalado no runner
          if command -v gradle >/dev/null 2>&1; then
            gradle wrapper --gradle-version 8.2 --distribution-type bin || true
          fi

          # 2. Fallback garantido: baixa a distribuicao oficial do Gradle e gera o wrapper
          if [ ! -s gradle/wrapper/gradle-wrapper.jar ] || ! unzip -tq gradle/wrapper/gradle-wrapper.jar 2>/dev/null; then
            echo "Baixando distribuicao oficial do Gradle 8.2..."
            curl -fsSL https://services.gradle.org/distributions/gradle-8.2-bin.zip -o /tmp/gradle-8.2-bin.zip
            unzip -q /tmp/gradle-8.2-bin.zip -d /tmp/
            /tmp/gradle-8.2/bin/gradle wrapper --gradle-version 8.2 --distribution-type bin
            rm -rf /tmp/gradle-8.2*
          fi
        fi

        chmod +x gradlew
        echo "Validacao do Gradle Wrapper concluida com sucesso:"
        unzip -l gradle/wrapper/gradle-wrapper.jar | grep "GradleWrapperMain" || true

    - name: 4. Configurar Gradle Cache
      uses: gradle/actions/setup-gradle@v3

    - name: 5. Aceitar Licencas do Android SDK
      run: |
        yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

    - name: 6. Compilar APK Android (Debug)
      run: ./gradlew assembleDebug --stacktrace

    - name: 7. Publicar APK nos Artefatos do GitHub
      uses: actions/upload-artifact@v4
      with:
        name: Paciencia-Solitaire-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: 8. Executar Testes Unitarios da Logica Klondike (Opcional)
      continue-on-error: true
      run: ./gradlew testDebugUnitTest --stacktrace

    - name: 9. Resumo da Compilacao
      if: always()
      run: |
        echo "## 🃏 Paciência Klondike — APK Gerado com Sucesso! 🎉" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "O APK foi compilado e está disponível para download direto no seu celular:" >> $GITHUB_STEP_SUMMARY
        echo "1. Role até o fim desta página na seção **Artifacts**." >> $GITHUB_STEP_SUMMARY
        echo "2. Clique em **Paciencia-Solitaire-APK** para baixar o arquivo." >> $GITHUB_STEP_SUMMARY
        echo "3. Abra o arquivo no seu celular Android e instale diretamente (não necessita Android Studio)!" >> $GITHUB_STEP_SUMMARY
