name: Gerar APK da Paciencia

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
    - name: 1. Baixar Codigo do Repositorio
      uses: actions/checkout@v4

    - name: 2. Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. Configurar Gradle Cache
      uses: gradle/actions/setup-gradle@v3

    - name: 4. Aceitar Licencas do Android SDK
      run: |
        # O Android SDK ja vem pre-instalado no runner do GitHub em /usr/local/lib/android/sdk
        # NOTA: NUNCA use 'android-actions/setup-android' pois ela tenta baixar 'tools' que nao existe mais no SDK 16+
        yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

    - name: 5. Garantir Gradle Wrapper e Permissoes
      run: |
        chmod +x gradlew || true
        mkdir -p gradle/wrapper
        if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
          echo "Baixando gradle-wrapper.jar 8.2..."
          curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar || gradle wrapper --gradle-version 8.2
        fi

    - name: 6. Executar Testes Unitarios da Logica Klondike
      run: ./gradlew testDebugUnitTest --stacktrace

    - name: 7. Compilar APK (Debug)
      run: ./gradlew assembleDebug --stacktrace

    - name: 8. Publicar APK nos Artefatos do GitHub
      uses: actions/upload-artifact@v4
      with:
        name: Paciencia-Solitaire-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: 9. Resumo da Compilacao
      if: always()
      run: |
        echo "## 🃏 Paciência Klondike — APK Gerado com Sucesso! 🎉" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "O APK foi compilado e está disponível para download direto no seu celular:" >> $GITHUB_STEP_SUMMARY
        echo "1. Role até o fim desta página na seção **Artifacts**." >> $GITHUB_STEP_SUMMARY
        echo "2. Clique em **Paciencia-Solitaire-APK** para baixar o arquivo." >> $GITHUB_STEP_SUMMARY
        echo "3. Abra o arquivo no seu celular Android e instale diretamente (não necessita Android Studio)!" >> $GITHUB_STEP_SUMMARY
