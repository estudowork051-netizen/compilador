name: Gerar APK da Paciencia

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar Codigo
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Dar Permissao ao Gradlew
      run: chmod +x gradlew || true

    - name: Gerar Gradle Wrapper se necessario
      run: |
        if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
          gradle wrapper --gradle-version 8.2
        fi

    - name: Executar Testes Unitarios
      run: ./gradlew testDebugUnitTest --stacktrace

    - name: Compilar APK (Debug)
      run: ./gradlew assembleDebug --stacktrace

    - name: Disponibilizar APK para Download
      uses: actions/upload-artifact@v4
      with:
        name: Paciencia-Solitaire-APK
        path: app/build/outputs/apk/debug/app-debug.apk
