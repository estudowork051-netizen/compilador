# Configuração do Coturn para o RemoteDesk
# Permite atravessar CGNAT, NAT simétrico e firewalls restritivos residenciais ou móveis (4G/5G).

# Portas de escuta padrão para STUN e TURN (UDP e TCP)
listening-port=3478
tls-listening-port=5349

# IPs de escuta (0.0.0.0 para todas as interfaces disponíveis)
listening-ip=0.0.0.0

# Faixa de portas para alocação de relé WebRTC
min-port=49152
max-port=49200

# Domínio / Realm de autenticação
realm=remotedesk.local

# Autenticação baseada em segredo compartilhado para credenciais efêmeras baseadas em tempo (TURN REST API)
# O segredo abaixo é sobrescrito em produção pela variável de ambiente TURN_SECRET
use-auth-secret
static-auth-secret=remotedesk_super_secret_turn_key_2026

# Ativa impressão digital nas mensagens STUN/TURN
fingerprint

# Segurança: impede que o servidor TURN acesse endereços privados locais
no-loopback-peers
no-multicast-peers

# Nível de log
verbose
