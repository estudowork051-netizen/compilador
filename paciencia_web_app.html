<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
body, html { width: 100%; height: 100%; overflow: hidden; background: #0B0F19; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; touch-action: none; }

/* Top HUD — Fantasia Sombria */
#hud-top {
  position: absolute; top: 0; left: 0; right: 0; height: 52px;
  background: linear-gradient(180deg, rgba(13, 21, 36, 0.95), rgba(8, 14, 24, 0.92));
  backdrop-filter: blur(12px);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 12px; color: #F8FAFC; z-index: 10; font-size: 13px;
  border-bottom: 1.5px solid rgba(212, 175, 55, 0.35);
}
.hud-badge {
  display: flex; align-items: center; gap: 6px; cursor: pointer;
  background: rgba(212, 175, 55, 0.12); padding: 4px 10px; border-radius: 8px;
  border: 1px solid rgba(212, 175, 55, 0.35);
}
.hud-badge:active { background: rgba(212, 175, 55, 0.25); }
.hud-coins {
  color: #FBBF24; font-weight: bold; display: flex; align-items: center; gap: 4px;
}
.level-badge { color: #FBBF24; font-weight: 800; font-size: 14px; }

/* Bottom HUD — Fantasia Sombria */
#hud-bottom {
  position: absolute; bottom: 0; left: 0; right: 0; height: 60px;
  background: linear-gradient(0deg, rgba(13, 21, 36, 0.95), rgba(8, 14, 24, 0.92));
  backdrop-filter: blur(12px);
  display: flex; align-items: center; justify-content: space-around;
  padding: 0 6px; z-index: 10;
  border-top: 1.5px solid rgba(212, 175, 55, 0.35);
}
.btn-control {
  background: none; border: none; color: #94A3B8; font-size: 11px;
  display: flex; flex-direction: column; align-items: center; cursor: pointer;
  padding: 4px 8px; border-radius: 8px; font-weight: 500;
}
.btn-control svg { width: 22px; height: 22px; fill: #F8FAFC; margin-bottom: 2px; }
.btn-control:active { background: rgba(255,255,255,0.06); }
.btn-control:active svg { fill: #38BDF8; }

#gameCanvas { display: block; width: 100%; height: 100%; }

/* Modals */
.modal {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
  z-index: 100; align-items: center; justify-content: center; padding: 16px;
  backdrop-filter: blur(6px);
}
.modal-content {
  background: linear-gradient(180deg, #182236, #0E1624);
  border: 1.5px solid rgba(212, 175, 55, 0.45);
  border-radius: 16px;
  max-width: 380px; width: 100%; padding: 20px; color: #F8FAFC; text-align: center;

}
.modal h2 { color: #FBBF24; font-size: 20px; font-weight: 800; margin-bottom: 4px; }
.modal p { color: #94A3B8; font-size: 13px; line-height: 1.4; margin-bottom: 12px; }
.modal-btn {
  width: 100%; padding: 12px; border-radius: 10px; border: none; font-weight: bold;
  font-size: 14px; margin-top: 8px; cursor: pointer; transition: transform 0.1s;
}
.modal-btn:active { transform: scale(0.98); }
.btn-gold { background: linear-gradient(135deg, #FBBF24, #D97706); color: #000; }
.btn-blue { background: #2563EB; color: #FFF; }
.btn-gray { background: #374151; color: #F3F4F6; }

/* Shop Modal Styles */

  display: flex; gap: 6px; background: rgba(255,255,255,0.06); padding: 4px; border-radius: 10px; margin-bottom: 12px;
}
.shop-tab {
  flex: 1; padding: 8px; border-radius: 8px; font-size: 12px; font-weight: bold;
  color: #94A3B8; cursor: pointer; text-align: center; background: transparent; border: none;
}
.shop-tab.active { background: #2563EB; color: #FFF; }

.preview-box {

.preview-info { flex: 1; min-width: 0; }

.shop-list {

.shop-item {

.shop-item-btn {

}

/* Toast */
#toast {
  position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
  background: #10B981; color: #FFF; font-weight: bold; font-size: 13px;
  padding: 8px 18px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.4);
  display: none; z-index: 200; pointer-events: none;
}

// --- SISTEMA DE ÁUDIO NATIVO (Sintetizador Web Audio API) ---
let audioCtx = null;
function playSound(type) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'touch') {
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.exponentialRampToValueAtTime(320, now + 0.06);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc.start(now); osc.stop(now + 0.06);
    } else if (type === 'place') {
      osc.frequency.setValueAtTime(520, now);
      osc.frequency.exponentialRampToValueAtTime(680, now + 0.08);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      osc.start(now); osc.stop(now + 0.08);
    } else if (type === 'invalid') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(140, now);
      osc.frequency.linearRampToValueAtTime(90, now + 0.12);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.start(now); osc.stop(now + 0.12);
    } else if (type === 'victory') {
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
        const noteOsc = audioCtx.createOscillator();
        const noteGain = audioCtx.createGain();
        noteOsc.connect(noteGain);
        noteGain.connect(audioCtx.destination);
        noteOsc.frequency.setValueAtTime(freq, now + idx * 0.1);
        noteGain.gain.setValueAtTime(0.15, now + idx * 0.1);
        noteGain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.35);
        noteOsc.start(now + idx * 0.1); noteOsc.stop(now + idx * 0.1 + 0.35);
      });
    }
  } catch(e) {}
}

let highestLevel = parseInt(localStorage.getItem('pac_high_lvl') || '1');
let currentLevel = parseInt(localStorage.getItem('pac_cur_lvl') || '1');

let unlockedAvatars = JSON.parse(localStorage.getItem('pac_unlocked_avatars') || '["avatar_adventurer"]');
let rewardedLevels = JSON.parse(localStorage.getItem('pac_rewarded_levels') || '[]');

let currentScenery = SCENERIES.find(s => s.id === currentSceneryId) || SCENERIES[0];
let currentSkin = SKINS.find(s => s.id === equippedSkinId) || SKINS[0];
let currentAvatar = AVATARS.find(a => a.id === equippedAvatarId) || AVATARS[0];

let stock = [], waste = [], foundations = [[], [], [], []], tableaus = [[], [], [], [], [], [], []];
let undoStack = [];
let moves = 0, seconds = 0, timerInterval = null, isWon = false;

// Estado Visual e Efeitos
let invalidShakeTime = 0, invalidShakeCol = -1;
let sparkParticles = [];
let columnGlows = []; // col, start
let activePreviewItem = currentSkin;

// Layout
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let cw = 0, ch = 0, gap = 0, topY = 0, tabY = 0;
let stockRect = {}, wasteRect = {}, fRects = [], tRects = [];

// Drag
let isDragging = false, dragCards = [], dragSource = null;
let touchDownX = 0, touchDownY = 0, dragCurX = 0, dragCurY = 0, dragOffX = 0, dragOffY = 0;

function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 2200);
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth;
  const h = window.innerHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.scale(dpr, dpr);

  gap = w * 0.02;
  cw = (w - (8 * gap)) / 7;
  ch = cw * 1.42;
  topY = 64;
  tabY = topY + ch + 18;

  stockRect = { x: gap, y: topY, w: cw, h: ch };
  wasteRect = { x: gap * 2 + cw, y: topY, w: cw, h: ch };
  fRects = [];
  for (let i = 0; i < 4; i++) {
    fRects.push({ x: gap + (3 + i) * (cw + gap), y: topY, w: cw, h: ch });
  }
  tRects = [];
  for (let i = 0; i < 7; i++) {
    tRects.push({ x: gap + i * (cw + gap), y: tabY, w: cw, h: h - tabY - 70 });
  }
}
window.addEventListener('resize', resize);

function updateHud() {
  document.getElementById('lblLevel').innerText = `Nível ${currentLevel}`;
  document.getElementById('lblCoins').innerText = coinsBalance;
  document.getElementById('lblShopCoins').innerText = coinsBalance;
  document.getElementById('lblMoves').innerText = `${moves} Mov`;
  document.getElementById('lblAvatarEmoji').innerText = currentAvatar.emoji;
  let m = Math.floor(seconds / 60).toString().padStart(2, '0');
  let s = (seconds % 60).toString().padStart(2, '0');
  document.getElementById('lblTime').innerText = `${m}:${s}`;
}

function startLevel(lvl) {
  currentLevel = lvl;
  localStorage.setItem('pac_cur_lvl', lvl);
  moves = 0; seconds = 0; isWon = false;
  undoStack = [];
  clearInterval(timerInterval);
  timerInterval = setInterval(() => { seconds++; updateHud(); }, 1000);

  // Auto scenery unlock
  const autoTheme = SCENERIES.slice().reverse().find(s => lvl >= s.minLevel) || SCENERIES[0];
  setScenery(autoTheme);

  // Criar Baralho
  let deck = [];
  let id = 0;
  SUITS.forEach(s => {
    RANKS.forEach(r => {
      deck.push({ id: id++, suit: s, rank: r, faceUp: false });
    });
  });

  // Embaralhamento determinístico pelo Nível
  let seed = 10007 * lvl + 99991;
  for (let i = deck.length - 1; i > 0; i--) {
    seed = (seed * 9301 + 49297) % 233280;
    let j = Math.floor((seed / 233280) * (i + 1));
    let t = deck[i]; deck[i] = deck[j]; deck[j] = t;
  }

  stock = []; waste = [];
  foundations = [[], [], [], []];
  tableaus = [[], [], [], [], [], [], []];

  let cIdx = 0;
  for (let col = 0; col < 7; col++) {
    for (let row = 0; row <= col; row++) {
      let c = deck[cIdx++];
      c.faceUp = (row === col);
      tableaus[col].push(c);
    }
  }
  while (cIdx < deck.length) {
    let c = deck[cIdx++];
    c.faceUp = false;
    stock.push(c);
  }
  updateHud();
}

function setScenery(s) {
  currentScenery = s;
  currentSceneryId = s.id;
  localStorage.setItem('pac_scenery', s.id);
}

// --- RENDERIZAÇÃO DOS CENÁRIOS VIVOS (Procedural Canvas) ---
function drawLiveBackground(w, h, now) {
  // Gradiente vertical do céu
  let bg = ctx.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, currentScenery.bgTop);
  bg.addColorStop(1, currentScenery.bgBot);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, w, h);

  if (currentScenery.id === 'forest') {
    // Floresta Encantada: raios de sol, árvores e vaga-lumes pulsantes
    let rayOffset = Math.sin(now * 0.0008) * (w * 0.04);
    let rayG = ctx.createLinearGradient(0, 0, w * 0.7 + rayOffset, h * 0.7);
    rayG.addColorStop(0, 'rgba(167, 243, 208, 0.15)');
    rayG.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rayG;
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(w * 0.35, 0);
    ctx.lineTo(w * 0.85 + rayOffset, h * 0.85); ctx.lineTo(w * 0.25 + rayOffset, h * 0.85);
    ctx.closePath(); ctx.fill();

    // Silhuetas de árvores
    ctx.fillStyle = 'rgba(2, 11, 5, 0.25)';
    ctx.beginPath();
    ctx.moveTo(0, h);
    let distBase = h * 0.80;
    ctx.lineTo(0, distBase);
    let step = w / 7;
    for (let curX = 0; curX < w; curX += step) {
      ctx.lineTo(curX + step * 0.5, distBase - 45);
      ctx.lineTo(curX + step, distBase);
    }
    ctx.lineTo(w, h); ctx.closePath(); ctx.fill();

    // Vaga-lumes luminosos pulsantes
    const fireflies = [
      [w * 0.15, h * 0.62, 0.0], [w * 0.42, h * 0.52, 1.8],
      [w * 0.78, h * 0.58, 3.2], [w * 0.88, h * 0.72, 4.5], [w * 0.28, h * 0.76, 2.4]
    ];
    fireflies.forEach(ff => {
      let fx = ff[0] + Math.sin(now * 0.001 + ff[2]) * 10;
      let fy = ff[1] + Math.cos(now * 0.0015 + ff[2]) * 6;
      let pulse = Math.sin(now * 0.003 + ff[2]) * 0.5 + 0.5;
      ctx.fillStyle = `rgba(52, 211, 153, ${pulse * 0.45})`;
      ctx.beginPath(); ctx.arc(fx, fy, 12 * pulse + 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `rgba(253, 224, 71, ${pulse * 0.9 + 0.1})`;
      ctx.beginPath(); ctx.arc(fx, fy, 2.5, 0, Math.PI * 2); ctx.fill();
    });
  } else if (currentScenery.id === 'frozen') {
    // Montanhas Geladas: aurora boreal e picos nevados
    let aShift = Math.sin(now * 0.0006) * 30;
    let aG = ctx.createLinearGradient(w * 0.2 + aShift, 0, w * 0.8 - aShift, h * 0.45);
    aG.addColorStop(0, 'rgba(56, 189, 248, 0.2)');
    aG.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = aG;
    ctx.fillRect(0, 0, w, h * 0.5);

    // Picos de Montanhas
    ctx.fillStyle = 'rgba(12, 27, 43, 0.4)';
    ctx.beginPath();
    ctx.moveTo(0, h); ctx.lineTo(0, h * 0.72);
    ctx.lineTo(w * 0.2, h * 0.62); ctx.lineTo(w * 0.45, h * 0.74);
    ctx.lineTo(w * 0.7, h * 0.58); ctx.lineTo(w, h * 0.70);
    ctx.lineTo(w, h); ctx.closePath(); ctx.fill();
  } else if (currentScenery.id === 'desert') {
    // Deserto Dourado: miragem solar e dunas com crista iluminada
    let sunP = Math.sin(now * 0.001) * 0.08 + 1.0;
    let sG = ctx.createRadialGradient(w * 0.5, h * 0.62, 5, w * 0.5, h * 0.62, w * 0.5 * sunP);
    sG.addColorStop(0, 'rgba(251, 191, 36, 0.25)');
    sG.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sG;
    ctx.beginPath(); ctx.arc(w * 0.5, h * 0.62, w * 0.5 * sunP, 0, Math.PI * 2); ctx.fill();

    // Duna frontal
    ctx.fillStyle = 'rgba(24, 10, 4, 0.45)';
    ctx.beginPath();
    ctx.moveTo(0, h); ctx.lineTo(0, h * 0.80);
    ctx.quadraticCurveTo(w * 0.35, h * 0.84, w * 0.70, h * 0.76);
    ctx.quadraticCurveTo(w * 0.88, h * 0.73, w, h * 0.77);
    ctx.lineTo(w, h); ctx.closePath(); ctx.fill();
  } else if (currentScenery.id === 'medieval') {
    // Reino Medieval: silhueta do castelo e tochas dinâmicas
    ctx.fillStyle = 'rgba(8, 2, 16, 0.45)';
    ctx.beginPath();
    let cY = h * 0.80;
    ctx.moveTo(0, h); ctx.lineTo(0, cY);
    ctx.lineTo(w * 0.14, cY); ctx.lineTo(w * 0.14, cY - 60); ctx.lineTo(w * 0.22, cY - 60); ctx.lineTo(w * 0.22, cY - 20);
    ctx.lineTo(w * 0.62, cY - 20); ctx.lineTo(w * 0.62, cY - 85); ctx.lineTo(w * 0.74, cY - 85); ctx.lineTo(w * 0.74, cY);
    ctx.lineTo(w, cY); ctx.lineTo(w, h); ctx.closePath(); ctx.fill();

    // Janelas iluminadas por velas
    ctx.fillStyle = 'rgba(253, 224, 71, 0.6)';
    ctx.fillRect(w * 0.16, cY - 45, 12, 18);
    ctx.fillRect(w * 0.66, cY - 65, 16, 22);

    // Tochas crepitantes
    let t1 = Math.sin(now * 0.008) * 0.15 + 0.85;
    let tG = ctx.createRadialGradient(w * 0.20, cY - 55, 2, w * 0.20, cY - 55, 22 * t1);
    tG.addColorStop(0, 'rgba(249, 115, 22, 0.55)');
    tG.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = tG;
    ctx.beginPath(); ctx.arc(w * 0.20, cY - 55, 22 * t1, 0, Math.PI * 2); ctx.fill();
  } else if (currentScenery.id === 'cosmic') {
    // Noite Cósmica: nebulosas e estrelas cintilantes
    let nG1 = ctx.createRadialGradient(w * 0.35, h * 0.35, 10, w * 0.35, h * 0.35, w * 0.55);
    nG1.addColorStop(0, 'rgba(99, 102, 241, 0.25)');
    nG1.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = nG1;
    ctx.beginPath(); ctx.arc(w * 0.35, h * 0.35, w * 0.55, 0, Math.PI * 2); ctx.fill();

    // Estrelas proeminentes
    [[w*0.15, h*0.2, 0], [w*0.8, h*0.25, 2], [w*0.3, h*0.5, 4], [w*0.7, h*0.7, 1.5]].forEach(st => {
      let tw = Math.sin(now * 0.003 + st[2]) * 0.5 + 0.5;
      ctx.fillStyle = `rgba(224, 231, 255, ${tw * 0.8 + 0.2})`;
      ctx.beginPath(); ctx.arc(st[0], st[1], 2 * tw + 1, 0, Math.PI * 2); ctx.fill();
    });
  }
}

// --- RENDERIZAÇÃO DO TABULEIRO DE CARTAS ---
function render(now) {
  const w = window.innerWidth;
  const h = window.innerHeight;
  ctx.clearRect(0, 0, w, h);

  // 1. Fundo Dinâmico
  drawLiveBackground(w, h, now);

  // 2. Slots Vazios
  drawSlot(stockRect.x, stockRect.y, '↺');
  drawSlot(wasteRect.x, wasteRect.y);
  fRects.forEach((r, idx) => {
    drawSlot(r.x, r.y, ['♠','♥','♣','♦'][idx]);
  });
  tRects.forEach(r => drawSlot(r.x, r.y));

  // 3. Stock
  if (stock.length > 0) drawCard(stock[stock.length - 1], stockRect.x, stockRect.y);

  // 4. Waste
  if (waste.length > 0) {
    let top = (isDragging && dragSource === 'waste') ? waste[waste.length - 2] : waste[waste.length - 1];
    if (top) drawCard(top, wasteRect.x, wasteRect.y);
  }

  // 5. Foundations
  foundations.forEach((f, idx) => {
    if (f.length > 0) {
      let top = (isDragging && dragSource === `f_${idx}`) ? f[f.length - 2] : f[f.length - 1];
      if (top) drawCard(top, fRects[idx].x, fRects[idx].y);
    }
  });

  // 6. Tableaus
  tableaus.forEach((t, col) => {
    let r = tRects[col];
    let curY = r.y;
    let limit = (isDragging && dragSource === `t_${col}`) ? t.length - dragCards.length : t.length;
    
    // Shake para jogada inválida
    let shakeOffset = 0;
    if (invalidShakeCol === col && (now - invalidShakeTime) < 250) {
      let prog = (now - invalidShakeTime) / 250;
      shakeOffset = Math.sin(prog * Math.PI * 4) * 6 * (1 - prog);
    }

    for (let i = 0; i < limit; i++) {
      let c = t[i];
      drawCard(c, r.x + shakeOffset, curY);
      curY += c.faceUp ? ch * 0.28 : ch * 0.18;
    }

    if (invalidShakeCol === col && (now - invalidShakeTime) < 250) {
      ctx.strokeStyle = '#EF4444';
      ctx.lineWidth = 3;
      roundRect(ctx, r.x + shakeOffset - 2, r.y - 2, cw + 4, ch + 4, 8);
      ctx.stroke();
    }
  });

  // 7. Realce de Destinos Válidos durante o Arraste
  if (isDragging && dragCards.length > 0) {
    let first = dragCards[0];
    let pulse = Math.sin(now * 0.008) * 0.35 + 0.65;
    ctx.strokeStyle = `rgba(52, 211, 153, ${pulse})`;
    ctx.lineWidth = 3.5;

    // Destinos em Fundações
    if (dragCards.length === 1) {
      foundations.forEach((f, idx) => {
        if (canMoveToFoundation(first, f)) {
          roundRect(ctx, fRects[idx].x - 2, fRects[idx].y - 2, cw + 4, ch + 4, 8);
          ctx.stroke();
        }
      });
    }
    // Destinos em Colunas
    tableaus.forEach((t, col) => {
      if (dragSource !== `t_${col}` && canMoveToTableau(first, t)) {
        let r = tRects[col];
        let targetY = t.length === 0 ? r.y : r.y + (t.length - 1) * (ch * 0.28);
        roundRect(ctx, r.x - 2, targetY - 2, cw + 4, ch + 4, 8);
        ctx.stroke();
      }
    });
  }

  // 8. Cartas em Arraste (Floating Cards com Sombra 3D)
  if (isDragging && dragCards.length > 0) {
    let curX = dragCurX - dragOffX;
    let curY = dragCurY - dragOffY;
    dragCards.forEach(c => {
      drawCard(c, curX, curY, true);
      curY += ch * 0.28;
    });
  }

  // 9. Faíscas e Partículas Luminosas
  for (let i = sparkParticles.length - 1; i >= 0; i--) {
    let p = sparkParticles[i];
    p.x += p.vx; p.y += p.vy; p.alpha -= 0.02;
    if (p.alpha <= 0) {
      sparkParticles.splice(i, 1);
    } else {
      ctx.fillStyle = p.color + Math.floor(p.alpha * 255).toString(16).padStart(2, '0');
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
  }

  // 10. Cascata de Vitória
  if (isWon && Math.random() < 0.2) {
    addSparkle(Math.random() * w, h * 0.15, Math.random() < 0.5 ? '#FBBF24' : '#34D399', 5);
  }

  requestAnimationFrame(render);
}

function addSparkle(x, y, color = '#FBBF24', count = 8) {
  for (let i = 0; i < count; i++) {
    sparkParticles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 4,
      vy: -(Math.random() * 3 + 1),
      size: Math.random() * 3 + 2,
      alpha: 1.0,
      color: color
    });
  }
}

function drawSlot(x, y, watermark) {
  ctx.strokeStyle = currentScenery.accent + '33';
  ctx.lineWidth = 1.5;
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  roundRect(ctx, x, y, cw, ch, 6);
  ctx.fill(); ctx.stroke();
  if (watermark) {
    ctx.fillStyle = currentScenery.accent + '44';
    ctx.font = `${cw * 0.35}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(watermark, x + cw / 2, y + ch / 2);
  }
}

// Renderiza a Carta (com a skin ativa, moldura nobre e corte 3D)
function drawCard(card, x, y, isElevated) {
  ctx.save();
  if (isElevated) {
    ctx.shadowColor = 'rgba(0,0,0,0.55)';
    ctx.shadowBlur = 16; ctx.shadowOffsetY = 10;
  }
  if (!card.faceUp) {
    // Verso com gradiente da Skin
    let g = ctx.createLinearGradient(x, y, x + cw, y + ch);
    g.addColorStop(0, currentSkin.p1);
    g.addColorStop(1, currentSkin.p2);
    ctx.fillStyle = g;
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1.2;
    roundRect(ctx, x, y, cw, ch, 6);
    ctx.fill(); ctx.stroke();

    // Moldura interna ornamental
    ctx.strokeStyle = currentSkin.acc + '88';
    roundRect(ctx, x + 4, y + 4, cw - 8, ch - 8, 4);
    ctx.stroke();

    // Padrão geométrico da skin
    drawSkinPattern(ctx, currentSkin.pattern, x + cw / 2, y + ch / 2, cw * 0.28, currentSkin.acc);
  } else {
    // Face frontal em pergaminho marfim suave
    let fg = ctx.createLinearGradient(x, y, x, y + ch);
    fg.addColorStop(0, '#FFFDF9');
    fg.addColorStop(1, '#F3EFE6');
    ctx.fillStyle = fg;
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.22)';
    ctx.lineWidth = 1.2;
    roundRect(ctx, x, y, cw, ch, 6);
    ctx.fill(); ctx.stroke();

    // Moldura interna de filigrana dourada
    ctx.strokeStyle = 'rgba(212, 175, 55, 0.25)';
    ctx.lineWidth = 1;
    roundRect(ctx, x + 3, y + 3, cw - 6, ch - 6, 4);
    ctx.stroke();

    ctx.fillStyle = card.suit.isRed ? '#E11D48' : '#0F172A';
    ctx.font = `bold ${cw * 0.22}px sans-serif`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(card.rank.label, x + 5, y + 5);

    ctx.font = `${cw * 0.16}px sans-serif`;
    ctx.fillText(card.suit.symbol, x + 5, y + 5 + cw * 0.22);

    // Centro
    if (card.rank.val > 10) {
      // Borda nobre dourada nas figuras J, Q, K
      ctx.strokeStyle = 'rgba(212, 175, 55, 0.5)';
      ctx.lineWidth = 1.6;
      roundRect(ctx, x + cw * 0.2, y + ch * 0.26, cw * 0.6, ch * 0.48, 5);
      ctx.stroke();

      // Marca d'água heráldica sutil
      ctx.fillStyle = card.suit.isRed ? 'rgba(225, 29, 72, 0.12)' : 'rgba(15, 23, 42, 0.12)';
      ctx.font = `${cw * 0.38}px sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(card.suit.symbol, x + cw / 2, y + ch / 2 - 2);

      ctx.fillStyle = card.suit.isRed ? '#E11D48' : '#0F172A';
      ctx.font = `serif bold ${cw * 0.36}px`;
      ctx.fillText(card.rank.label, x + cw / 2, y + ch / 2 - 2);
      ctx.font = `${cw * 0.16}px sans-serif`;
      ctx.fillText(card.suit.symbol, x + cw / 2, y + ch * 0.65);
    } else if (card.rank.val === 1) {
      ctx.font = `${cw * 0.42}px sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(card.suit.symbol, x + cw / 2, y + ch / 2);
    } else {
      ctx.font = `${cw * 0.34}px sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(card.suit.symbol, x + cw / 2, y + ch / 2);
    }
  }
  ctx.restore();
}

function drawSkinPattern(c, pattern, cx, cy, size, acc) {
  c.save();
  c.strokeStyle = acc;
  c.fillStyle = acc + '33';
  c.lineWidth = 1.5;
  c.beginPath();
  if (pattern === 'classic' || pattern === 'golden') {
    c.moveTo(cx, cy - size); c.lineTo(cx + size, cy); c.lineTo(cx, cy + size); c.lineTo(cx - size, cy); c.closePath();
    c.stroke(); if (pattern === 'golden') { c.arc(cx, cy, size * 0.4, 0, Math.PI * 2); c.stroke(); }
  } else if (pattern === 'arcane') {
    c.arc(cx, cy, size * 0.8, 0, Math.PI * 2); c.stroke();
    c.moveTo(cx, cy - size * 0.7); c.lineTo(cx + size * 0.7, cy); c.lineTo(cx, cy + size * 0.7); c.lineTo(cx - size * 0.7, cy); c.closePath(); c.stroke();
  } else if (pattern === 'shadow') {
    c.moveTo(cx - size * 0.6, cy - size * 0.6); c.lineTo(cx + size * 0.6, cy - size * 0.6);
    c.lineTo(cx, cy + size * 0.9); c.closePath(); c.stroke(); c.fill();
  } else if (pattern === 'nature') {
    c.ellipse(cx, cy, size * 0.5, size * 0.9, 0, 0, Math.PI * 2); c.stroke();
  } else if (pattern === 'ice') {
    c.moveTo(cx, cy - size); c.lineTo(cx, cy + size); c.moveTo(cx - size, cy); c.lineTo(cx + size, cy);
    c.moveTo(cx - size * 0.7, cy - size * 0.7); c.lineTo(cx + size * 0.7, cy + size * 0.7);
    c.moveTo(cx - size * 0.7, cy + size * 0.7); c.lineTo(cx + size * 0.7, cy - size * 0.7); c.stroke();
  } else if (pattern === 'cosmic') {
    c.arc(cx, cy, size * 0.5, 0, Math.PI * 2); c.stroke();
    c.arc(cx, cy, size * 0.9, 0, Math.PI * 2); c.stroke();
  } else if (pattern === 'royal') {
    c.moveTo(cx - size * 0.8, cy + size * 0.4); c.lineTo(cx + size * 0.8, cy + size * 0.4);
    c.lineTo(cx + size * 0.6, cy - size * 0.4); c.lineTo(cx, cy); c.lineTo(cx - size * 0.6, cy - size * 0.4); c.closePath(); c.stroke();
  }
  c.restore();
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);
  c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r);
  c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r);
  c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}

// --- REGRAS DO KLONDIKE ---
function canMoveToTableau(card, target) {
  if (target.length === 0) return card.rank.val === 13;
  let top = target[target.length - 1];
  return top.faceUp && (card.suit.isRed !== top.suit.isRed) && (card.rank.val === top.rank.val - 1);
}

function canMoveToFoundation(card, fPile) {
  if (fPile.length === 0) return card.rank.val === 1;
  let top = fPile[fPile.length - 1];
  return (card.suit.name === top.suit.name) && (card.rank.val === top.rank.val + 1);
}

function checkWin() {
  if (foundations.every(f => f.length === 13)) {
    isWon = true;
    clearInterval(timerInterval);
    playSound('victory');

    // Conceder moedas uma única vez por fase
    let coinsEarned = 0;
    if (!rewardedLevels.includes(currentLevel)) {
      coinsEarned = 10;
      coinsBalance += 10;
      rewardedLevels.push(currentLevel);
      localStorage.setItem('pac_coins', coinsBalance);
      localStorage.setItem('pac_rewarded_levels', JSON.stringify(rewardedLevels));
    }

    if (currentLevel >= highestLevel) {
      highestLevel = currentLevel + 1;
      localStorage.setItem('pac_high_lvl', highestLevel);
    }

    let newlyUnlocked = SCENERIES.find(s => s.minLevel === currentLevel + 1);
    let uDiv = document.getElementById('vicSceneryUnlock');
    if (newlyUnlocked) {
      uDiv.style.display = 'block';
      uDiv.innerText = `✨ Novo Cenário Desbloqueado: ${newlyUnlocked.name}!`;
    } else {
      uDiv.style.display = 'none';
    }

    document.getElementById('vicMessage').innerText = `Você concluiu a fase ${currentLevel} com perfeição!`;
    document.getElementById('vicStats').innerHTML = `
      <div><strong>Avatar:</strong> ${currentAvatar.emoji} ${currentAvatar.name}</div>
      <div><strong>Recompensa:</strong> ${coinsEarned > 0 ? '+10 Moedas 🪙' : 'Fase já premiada'}</div>
      <div><strong>Saldo Atual:</strong> ${coinsBalance} Moedas 🪙</div>
      <div><strong>Movimentos:</strong> ${moves} • <strong>Tempo:</strong> ${Math.floor(seconds/60)}m ${seconds%60}s</div>
    `;

    updateHud();
    document.getElementById('modalVictory').style.display = 'flex';
  }
}

// --- SISTEMA DE DESFAZER (UNDO) ---

function saveState() {
  const snapshot = {
    stock: stock.map(c => ({...c})),
    waste: waste.map(c => ({...c})),
    foundations: foundations.map(f => f.map(c => ({...c}))),
    tableaus: tableaus.map(t => t.map(c => ({...c}))),
    moves: moves
  };
  undoStack.push(snapshot);
  if (undoStack.length > 50) undoStack.shift();
}

function undo() {
  if (undoStack.length === 0) {
    playSound('invalid');
    showToast('Nenhum movimento para desfazer.');
    return;
  }
  const prev = undoStack.pop();
  stock = prev.stock;
  waste = prev.waste;
  foundations = prev.foundations;
  tableaus = prev.tableaus;
  moves = prev.moves;
  playSound('touch');
  updateHud();
  showToast('Jogada desfeita!');
}

// --- INTERAÇÕES DE TOQUE / ARRASTAR E SOLTAR ---
function getTouchPos(e) {
  let t = (e.touches && e.touches.length > 0)
    ? e.touches[0]
    : ((e.changedTouches && e.changedTouches.length > 0) ? e.changedTouches[0] : e);
  return { x: t.clientX, y: t.clientY };
}

function onTouchStart(e) {
  let pos = getTouchPos(e);
  touchDownX = pos.x; touchDownY = pos.y;
  dragCurX = pos.x; dragCurY = pos.y;
  isDragging = false; dragCards = []; dragSource = null;

  // 1. Stock
  if (pos.x >= stockRect.x && pos.x <= stockRect.x + cw && pos.y >= stockRect.y && pos.y <= stockRect.y + ch) {
    if (stock.length > 0) {
      saveState();
      let c = stock.pop(); c.faceUp = true; waste.push(c);
      playSound('touch'); moves++; updateHud();
    } else if (waste.length > 0) {
      saveState();
      while (waste.length > 0) {
        let c = waste.pop(); c.faceUp = false; stock.push(c);
      }
      playSound('touch'); moves++; updateHud();
    }
    return;
  }

  // 2. Waste
  if (waste.length > 0 && pos.x >= wasteRect.x && pos.x <= wasteRect.x + cw && pos.y >= wasteRect.y && pos.y <= wasteRect.y + ch) {
    isDragging = true; dragSource = 'waste'; dragCards = [waste[waste.length - 1]];
    dragOffX = pos.x - wasteRect.x; dragOffY = pos.y - wasteRect.y;
    playSound('touch');
    return;
  }

  // 3. Foundations
  for (let i = 0; i < 4; i++) {
    let r = fRects[i];
    if (foundations[i].length > 0 && pos.x >= r.x && pos.x <= r.x + cw && pos.y >= r.y && pos.y <= r.y + ch) {
      isDragging = true; dragSource = `f_${i}`; dragCards = [foundations[i][foundations[i].length - 1]];
      dragOffX = pos.x - r.x; dragOffY = pos.y - r.y;
      playSound('touch');
      return;
    }
  }

  // 4. Tableaus
  for (let col = 0; col < 7; col++) {
    let r = tRects[col];
    if (pos.x >= r.x && pos.x <= r.x + cw && pos.y >= r.y) {
      let t = tableaus[col];
      if (t.length === 0) continue;

      let curY = r.y;
      let touchedIdx = -1;
      for (let i = 0; i < t.length; i++) {
        let nextY = curY + (t[i].faceUp ? ch * 0.28 : ch * 0.18);
        if (i === t.length - 1) nextY = curY + ch;
        if (pos.y >= curY && pos.y <= nextY) { touchedIdx = i; break; }
        curY += (t[i].faceUp ? ch * 0.28 : ch * 0.18);
      }

      if (touchedIdx !== -1) {
        let c = t[touchedIdx];
        if (!c.faceUp && touchedIdx === t.length - 1) {
          saveState();
          c.faceUp = true;
          playSound('place');
          addSparkle(pos.x, curY + ch * 0.5, '#34D399', 8);
          moves++; updateHud();
          return;
        }
        if (c.faceUp) {
          isDragging = true; dragSource = `t_${col}`;
          dragCards = t.slice(touchedIdx);
          dragOffX = pos.x - r.x;
          dragOffY = pos.y - (r.y + (touchedIdx * (ch * 0.28)));
          playSound('touch');
          return;
        }
      }
    }
  }
}

function onTouchMove(e) {
  if (!isDragging) return;
  let pos = getTouchPos(e);
  dragCurX = pos.x; dragCurY = pos.y;
}

function onTouchEnd(e) {
  if (!isDragging || dragCards.length === 0) return;
  let pos = getTouchPos(e);
  let dist = Math.hypot(pos.x - touchDownX, pos.y - touchDownY);

  let success = false;
  let first = dragCards[0];

  // Tap-to-move Inteligente
  if (dist < 12) {
    if (dragCards.length === 1) {
      for (let i = 0; i < 4; i++) {
        if (canMoveToFoundation(first, foundations[i])) {
          removeDragCardsFromSource();
          foundations[i].push(first);
          addSparkle(fRects[i].x + cw / 2, fRects[i].y + ch / 2, '#FBBF24', 10);
          success = true;
          break;
        }
      }
    }
    if (!success) {
      for (let col = 0; col < 7; col++) {
        if (dragSource !== `t_${col}` && canMoveToTableau(first, tableaus[col])) {
          removeDragCardsFromSource();
          tableaus[col].push(...dragCards);
          success = true;
          break;
        }
      }
    }
  } else {
    // Drag and Drop
    // Verifica Fundações
    if (dragCards.length === 1) {
      for (let i = 0; i < 4; i++) {
        let r = fRects[i];
        if (pos.x >= r.x - 10 && pos.x <= r.x + cw + 10 && pos.y >= r.y - 10 && pos.y <= r.y + ch + 10) {
          if (canMoveToFoundation(first, foundations[i])) {
            removeDragCardsFromSource();
            foundations[i].push(first);
            addSparkle(r.x + cw / 2, r.y + ch / 2, '#FBBF24', 10);
            success = true;
            break;
          }
        }
      }
    }
    // Verifica Tableaus
    if (!success) {
      for (let col = 0; col < 7; col++) {
        let r = tRects[col];
        if (pos.x >= r.x - 10 && pos.x <= r.x + cw + 10 && pos.y >= r.y && pos.y <= r.y + r.h) {
          if (dragSource !== `t_${col}` && canMoveToTableau(first, tableaus[col])) {
            removeDragCardsFromSource();
            tableaus[col].push(...dragCards);
            success = true;
            break;
          }
        }
      }
    }
  }

  if (success) {
    playSound('place');
    moves++;
    // Se deixou uma carta virada para baixo no topo, vira automaticamente
    if (dragSource && dragSource.startsWith('t_')) {
      let cIdx = parseInt(dragSource.split('_')[1]);
      let t = tableaus[cIdx];
      if (t.length > 0 && !t[t.length - 1].faceUp) {
        t[t.length - 1].faceUp = true;
        addSparkle(tRects[cIdx].x + cw / 2, tRects[cIdx].y + (t.length - 1) * (ch * 0.28) + ch / 2, '#34D399', 6);
      }
    }
    updateHud();
    checkWin();
  } else {
    playSound('invalid');
    if (dragSource && dragSource.startsWith('t_')) {
      invalidShakeCol = parseInt(dragSource.split('_')[1]);
      invalidShakeTime = performance.now();
    }
  }

  isDragging = false; dragCards = []; dragSource = null;
}

function removeDragCardsFromSource() {
  saveState();
  if (dragSource === 'waste') {
    waste.pop();
  } else if (dragSource.startsWith('f_')) {
    let idx = parseInt(dragSource.split('_')[1]);
    foundations[idx].pop();
  } else if (dragSource.startsWith('t_')) {
    let col = parseInt(dragSource.split('_')[1]);
    tableaus[col].splice(tableaus[col].length - dragCards.length);
  }
}

// Event Listeners
canvas.addEventListener('touchstart', onTouchStart, { passive: false });
canvas.addEventListener('touchmove', onTouchMove, { passive: false });
canvas.addEventListener('touchend', onTouchEnd, { passive: false });
canvas.addEventListener('mousedown', onTouchStart);
canvas.addEventListener('mousemove', onTouchMove);
canvas.addEventListener('mouseup', onTouchEnd);

// --- MODAL DE LOJA PREMIUM & PRÉVIA ---
function updatePreview(item, isAvatar = false) {
  const prevCanvas = document.getElementById('previewCanvas');
  const pctx = prevCanvas.getContext('2d');
  const pw = prevCanvas.width, ph = prevCanvas.height;
  pctx.clearRect(0, 0, pw, ph);

  document.getElementById('prevColl').innerText = `COLEÇÃO: ${item.collection.toUpperCase()}`;
  document.getElementById('prevTitle').innerText = isAvatar ? `${item.emoji} ${item.name}` : item.name;
  document.getElementById('prevDesc').innerText = isAvatar ? `${item.title} • ${item.desc}` : item.desc;

  if (isAvatar) {
    pctx.fillStyle = item.bg;
    pctx.beginPath(); pctx.arc(pw/2, ph/2, pw*0.4, 0, Math.PI*2); pctx.fill();
    pctx.strokeStyle = item.border; pctx.lineWidth = 4; pctx.stroke();
    pctx.font = `${pw * 0.45}px sans-serif`; pctx.textAlign = 'center'; pctx.textBaseline = 'middle';
    pctx.fillText(item.emoji, pw/2, ph/2 + 2);
  } else {
    let g = pctx.createLinearGradient(6, 6, pw - 6, ph - 6);
    g.addColorStop(0, item.p1); g.addColorStop(1, item.p2);
    pctx.fillStyle = g;
    roundRect(pctx, 6, 6, pw - 12, ph - 12, 10);
    pctx.fill();
    pctx.strokeStyle = item.acc; pctx.lineWidth = 2.5; pctx.stroke();
    drawSkinPattern(pctx, item.pattern, pw/2, ph/2, pw * 0.28, item.acc);
  }
}

let activeTab = 'skins';
function renderShopList() {
  const container = document.getElementById('shopListContainer');
  container.innerHTML = '';

  if (activeTab === 'skins') {
    SKINS.forEach(s => {
      const isEquipped = s.id === currentSkin.id;
      const isUnlocked = unlockedSkins.includes(s.id);
      
      const itemEl = document.createElement('div');
      itemEl.className = 'shop-item';
      itemEl.innerHTML = `
        <div class="shop-item-info">
          <div class="shop-item-coll">${s.collection}</div>
          <div class="shop-item-name">${s.name}</div>
          <div class="shop-item-desc">${s.desc}</div>
        </div>
        <button class="shop-item-btn" style="background:rgba(255,255,255,0.1); color:#FFF; margin-right:4px;">👁️</button>
        <button class="shop-item-btn action-btn">${isEquipped ? 'Equipado' : isUnlocked ? 'Equipar' : `Comprar (${s.price} 🪙)`}</button>
      `;

      // Visualizar
      itemEl.children[1].onclick = () => updatePreview(s, false);
      itemEl.onclick = (e) => { if (e.target.tagName !== 'BUTTON') updatePreview(s, false); };

      // Ação
      const actBtn = itemEl.querySelector('.action-btn');
      if (isEquipped) {
        actBtn.style.background = '#374151'; actBtn.style.color = '#94A3B8';
      } else if (isUnlocked) {
        actBtn.style.background = '#2563EB'; actBtn.style.color = '#FFF';
        actBtn.onclick = () => {
          currentSkin = s; equippedSkinId = s.id;
          localStorage.setItem('pac_skin', s.id);
          showToast(`Skin ${s.name} equipada!`);
          updatePreview(s, false);
          renderShopList();
        };
      } else {
        actBtn.style.background = '#FBBF24'; actBtn.style.color = '#000';
        actBtn.onclick = () => {
          if (coinsBalance >= s.price) {
            coinsBalance -= s.price;
            unlockedSkins.push(s.id);
            currentSkin = s; equippedSkinId = s.id;
            localStorage.setItem('pac_coins', coinsBalance);
            localStorage.setItem('pac_unlocked_skins', JSON.stringify(unlockedSkins));
            localStorage.setItem('pac_skin', s.id);
            playSound('victory');
            showToast(`✨ Nova Skin Descoberta: ${s.name}! ✨`);
            updatePreview(s, false);
            updateHud();
            renderShopList();
          } else {
            playSound('invalid');
            showToast(`Moedas insuficientes! Faltam ${s.price - coinsBalance} moedas.`);
          }
        };
      }

      container.appendChild(itemEl);
    });
  } else {
    AVATARS.forEach(a => {
      const isEquipped = a.id === currentAvatar.id;
      const isUnlocked = unlockedAvatars.includes(a.id);

      const itemEl = document.createElement('div');
      itemEl.className = 'shop-item';
      itemEl.innerHTML = `
        <div style="font-size:24px; margin-right:6px;">${a.emoji}</div>
        <div class="shop-item-info">
          <div class="shop-item-coll">${a.collection}</div>
          <div class="shop-item-name">${a.name}</div>
          <div class="shop-item-desc">${a.title}</div>
        </div>
        <button class="shop-item-btn" style="background:rgba(255,255,255,0.1); color:#FFF; margin-right:4px;">👁️</button>
        <button class="shop-item-btn action-btn">${isEquipped ? 'Equipado' : isUnlocked ? 'Equipar' : `Comprar (${a.price} 🪙)`}</button>
      `;

      itemEl.children[2].onclick = () => updatePreview(a, true);
      itemEl.onclick = (e) => { if (e.target.tagName !== 'BUTTON') updatePreview(a, true); };

      const actBtn = itemEl.querySelector('.action-btn');
      if (isEquipped) {
        actBtn.style.background = '#374151'; actBtn.style.color = '#94A3B8';
      } else if (isUnlocked) {
        actBtn.style.background = '#2563EB'; actBtn.style.color = '#FFF';
        actBtn.onclick = () => {
          currentAvatar = a; equippedAvatarId = a.id;
          localStorage.setItem('pac_avatar', a.id);
          showToast(`Avatar ${a.name} equipado!`);
          updatePreview(a, true);
          updateHud();
          renderShopList();
        };
      } else {
        actBtn.style.background = '#FBBF24'; actBtn.style.color = '#000';
        actBtn.onclick = () => {
          if (coinsBalance >= a.price) {
            coinsBalance -= a.price;
            unlockedAvatars.push(a.id);
            currentAvatar = a; equippedAvatarId = a.id;
            localStorage.setItem('pac_coins', coinsBalance);
            localStorage.setItem('pac_unlocked_avatars', JSON.stringify(unlockedAvatars));
            localStorage.setItem('pac_avatar', a.id);
            playSound('victory');
            showToast(`✨ Novo Avatar Descoberto: ${a.name}! ✨`);
            updatePreview(a, true);
            updateHud();
            renderShopList();
          } else {
            playSound('invalid');
            showToast(`Moedas insuficientes! Faltam ${a.price - coinsBalance} moedas.`);
          }
        };
      }

      container.appendChild(itemEl);
    });
  }
}

};

};

document.getElementById('btnRestart').onclick = () => {

    startLevel(currentLevel);
  }
};

// Botão Desfazer (Undo)
document.getElementById('btnUndo').onclick = () => {
  undo();
};

// Botão Auto (Auto-completar jogadas possíveis para as Fundações)
document.getElementById('btnAuto').onclick = () => {
  // 1. Tenta mover do descarte (waste) para as fundações
  if (waste.length > 0) {
    let c = waste[waste.length - 1];
    for (let f = 0; f < 4; f++) {
      if (canMoveToFoundation(c, foundations[f])) {
        saveState();
        waste.pop();
        foundations[f].push(c);
        playSound('place');
        addSparkle(fRects[f].x + cw / 2, fRects[f].y + ch / 2, '#FBBF24', 8);
        moves++; updateHud(); checkWin();
        return;
      }
    }
  }

  // 2. Tenta mover das colunas (tableaus) para as fundações
  for (let col = 0; col < 7; col++) {
    let t = tableaus[col];
    if (t.length > 0) {
      let c = t[t.length - 1];
      if (c.faceUp) {
        for (let f = 0; f < 4; f++) {
          if (canMoveToFoundation(c, foundations[f])) {
            saveState();
            t.pop();
            foundations[f].push(c);
            if (t.length > 0 && !t[t.length - 1].faceUp) {
              t[t.length - 1].faceUp = true;
            }
            playSound('place');
            addSparkle(fRects[f].x + cw / 2, fRects[f].y + ch / 2, '#FBBF24', 8);
            moves++; updateHud(); checkWin();
            return;
          }
        }
      }
    }
  }

  playSound('invalid');
  showToast('Nenhuma carta pode subir no momento.');
};

// Inicialização
resize();
startLevel(currentLevel);
requestAnimationFrame(render);
